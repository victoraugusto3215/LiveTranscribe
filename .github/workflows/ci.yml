name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LiveTranscribe.slnx
      - name: Build
        run: dotnet build LiveTranscribe.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test LiveTranscribe.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livetranscribe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: livetranscribe-web/package-lock.json
      - name: Install
        # npm ci falha aqui: o oxlint (linter WASM) tem um problema conhecido
        # de empacotamento de dependências opcionais por plataforma que
        # confunde a checagem estrita do lockfile. npm install resolve certo.
        run: npm install
      - name: Build
        run: npm run build