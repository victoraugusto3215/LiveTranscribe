name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LiveTranscribe.slnx
      - name: Build
        run: dotnet build LiveTranscribe.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test LiveTranscribe.slnx --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: livetranscribe-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: livetranscribe-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
